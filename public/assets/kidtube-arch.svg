<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#111827" rx="12"/>
  <text x="30" y="40" fill="white" font-family="sans-serif" font-weight="900" font-size="18">KidTube — System Architecture & Workflow</text>
  
  <!-- Step 1: Parent Dashboard -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="210" height="130" rx="8" fill="#1f2937" stroke="#3b82f6" stroke-width="2"/>
    <text x="15" y="30" fill="#60a5fa" font-family="monospace" font-size="11" font-weight="bold">NEXT.JS 14 PARENT DASHBOARD</text>
    <text x="15" y="55" fill="white" font-family="sans-serif" font-size="13" font-weight="bold">Parent Moderation Console</text>
    <text x="15" y="78" fill="#9ca3af" font-family="sans-serif" font-size="11">• Channel whitelist manager</text>
    <text x="15" y="96" fill="#9ca3af" font-family="sans-serif" font-size="11">• Daily screen limits & bedtimes</text>
    <text x="15" y="114" fill="#9ca3af" font-family="sans-serif" font-size="11">• Video level overrides</text>
  </g>

  <!-- Arrow to Backend -->
  <line x1="240" y1="145" x2="290" y2="145" stroke="#3b82f6" stroke-width="3" stroke-dasharray="4 4"/>
  <polygon points="290,145 282,140 282,150" fill="#3b82f6"/>

  <!-- Step 2: Node.js Backend & AI Moderation -->
  <g transform="translate(300, 80)">
    <rect x="0" y="0" width="220" height="130" rx="8" fill="#1f2937" stroke="#10b981" stroke-width="2"/>
    <text x="15" y="30" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">EXPRESS + TF.JS PIPELINE</text>
    <text x="15" y="55" fill="white" font-family="sans-serif" font-size="13" font-weight="bold">AI Screening & Curation</text>
    <text x="15" y="78" fill="#9ca3af" font-family="sans-serif" font-size="11">• YouTube Data API v3</text>
    <text x="15" y="96" fill="#9ca3af" font-family="sans-serif" font-size="11">• NSFWJS thumbnail screening</text>
    <text x="15" y="114" fill="#9ca3af" font-family="sans-serif" font-size="11">• Inappropriate image flag</text>
  </g>

  <!-- Arrow to Storage -->
  <line x1="520" y1="145" x2="560" y2="145" stroke="#10b981" stroke-width="3" stroke-dasharray="4 4"/>
  <polygon points="560,145 552,140 552,150" fill="#10b981"/>

  <!-- Step 3: Firebase Firestore -->
  <g transform="translate(570, 80)">
    <rect x="0" y="0" width="195" height="130" rx="8" fill="#1f2937" stroke="#f59e0b" stroke-width="2"/>
    <text x="15" y="30" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold">FIREBASE CLOUD</text>
    <text x="15" y="55" fill="white" font-family="sans-serif" font-size="13" font-weight="bold">Data & Identity</text>
    <text x="15" y="78" fill="#9ca3af" font-family="sans-serif" font-size="11">• Firestore NoSQL schema</text>
    <text x="15" y="96" fill="#9ca3af" font-family="sans-serif" font-size="11">• Firebase Authentication</text>
    <text x="15" y="114" fill="#9ca3af" font-family="sans-serif" font-size="11">• Child profile isolation</text>
  </g>

  <!-- Downward Arrow to Child App -->
  <line x1="410" y1="210" x2="410" y2="260" stroke="#f43f5e" stroke-width="3" stroke-dasharray="4 4"/>
  <polygon points="410,260 405,252 415,252" fill="#f43f5e"/>

  <!-- Step 4: Child Expo Mobile Client -->
  <g transform="translate(180, 270)">
    <rect x="0" y="0" width="450" height="140" rx="8" fill="#1f2937" stroke="#f43f5e" stroke-width="2"/>
    <text x="20" y="30" fill="#fb7185" font-family="monospace" font-size="11" font-weight="bold">EXPO / REACT NATIVE MOBILE APPLICATION</text>
    <text x="20" y="55" fill="white" font-family="sans-serif" font-size="14" font-weight="bold">Curated Child Playback Client</text>
    <text x="20" y="80" fill="#9ca3af" font-family="sans-serif" font-size="12">✓ Zero algorithmic rabbit holes — only displays parent-authorized channel feeds</text>
    <text x="20" y="102" fill="#9ca3af" font-family="sans-serif" font-size="12">✓ AsyncStorage local feed caching for seamless offline and low-bandwidth playback</text>
    <text x="20" y="124" fill="#9ca3af" font-family="sans-serif" font-size="12">✓ Automated math checkpoint gate after every three video completions</text>
  </g>
</svg>