<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#0b0f19" rx="12"/>
  <!-- Header -->
  <rect x="0" y="0" width="800" height="60" fill="#111827"/>
  <rect x="24" y="16" width="30" height="30" rx="6" fill="#6366f1"/>
  <text x="31" y="37" fill="white" font-family="monospace" font-weight="bold" font-size="16">R</text>
  <text x="64" y="37" fill="white" font-family="system-ui, sans-serif" font-weight="900" font-size="20">Multi-Role RAG Assistant</text>
  
  <rect x="520" y="18" width="120" height="24" rx="12" fill="#6366f1" fill-opacity="0.2"/>
  <text x="532" y="34" fill="#a5b4fc" font-family="monospace" font-size="11" font-weight="bold">● GROQ LLM + FAISS</text>

  <rect x="660" y="18" width="116" height="24" rx="6" fill="#1f2937"/>
  <text x="672" y="34" fill="#10b981" font-family="monospace" font-size="11">Role: Engineering</text>

  <!-- Left: Department Documents & Roles -->
  <g transform="translate(24, 80)">
    <rect x="0" y="0" width="220" height="340" rx="8" fill="#111827" stroke="#1f2937"/>
    <text x="16" y="28" fill="#9ca3af" font-family="monospace" font-size="11" font-weight="bold">DEPARTMENT SCOPES</text>
    
    <rect x="14" y="40" width="192" height="34" rx="6" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1"/>
    <text x="24" y="62" fill="#c7d2fe" font-family="sans-serif" font-size="12" font-weight="bold">⚙ Engineering (Active)</text>

    <rect x="14" y="82" width="192" height="34" rx="6" fill="#1f2937"/>
    <text x="24" y="104" fill="#9ca3af" font-family="sans-serif" font-size="12">💰 Finance</text>

    <rect x="14" y="124" width="192" height="34" rx="6" fill="#1f2937"/>
    <text x="24" y="146" fill="#9ca3af" font-family="sans-serif" font-size="12">👥 Human Resources</text>

    <rect x="14" y="166" width="192" height="34" rx="6" fill="#1f2937"/>
    <text x="24" y="188" fill="#9ca3af" font-family="sans-serif" font-size="12">📢 Marketing</text>

    <!-- Ingestion Stats -->
    <rect x="14" y="220" width="192" height="100" rx="6" fill="#0b0f19" stroke="#374151"/>
    <text x="24" y="240" fill="#9ca3af" font-family="monospace" font-size="10" font-weight="bold">INDEX TELEMETRY</text>
    <text x="24" y="260" fill="white" font-family="sans-serif" font-size="11">Documents: 42 indexed</text>
    <text x="24" y="278" fill="white" font-family="sans-serif" font-size="11">Embedding: all-MiniLM-L6</text>
    <text x="24" y="296" fill="#34d399" font-family="monospace" font-size="10">FAISS Search: &lt; 12ms</text>
  </g>

  <!-- Right: Streamlit Chat Window -->
  <g transform="translate(260, 80)">
    <rect x="0" y="0" width="516" height="340" rx="8" fill="#111827" stroke="#1f2937"/>
    
    <!-- User Message -->
    <rect x="120" y="20" width="376" height="50" rx="8" fill="#6366f1"/>
    <text x="135" y="42" fill="white" font-family="sans-serif" font-size="12">What is our internal policy for deployment rollbacks?</text>
    <text x="135" y="58" fill="#c7d2fe" font-family="monospace" font-size="10">User (Engineering Dept) · 10:42 AM</text>

    <!-- Bot Response with Retrieved Document Evidence -->
    <rect x="20" y="85" width="476" height="180" rx="8" fill="#1f2937" stroke="#374151"/>
    <rect x="35" y="100" width="120" height="20" rx="4" fill="#10b981" fill-opacity="0.2"/>
    <text x="42" y="114" fill="#34d399" font-family="monospace" font-size="10">SOURCE: Eng-SOP-v3.pdf</text>
    
    <text x="35" y="140" fill="#f3f4f6" font-family="sans-serif" font-size="12" font-weight="bold">Deployment Rollback Procedure (Section 4.2):</text>
    <text x="35" y="162" fill="#d1d5db" font-family="sans-serif" font-size="11">1. If canary error rate exceeds 0.5% in 5 min, trigger auto-rollback.</text>
    <text x="35" y="182" fill="#d1d5db" font-family="sans-serif" font-size="11">2. Notify on-call in #eng-alerts with error hash and commit SHA.</text>
    <text x="35" y="202" fill="#d1d5db" font-family="sans-serif" font-size="11">3. Rollback executes via Helm release reversion in under 90s.</text>

    <text x="35" y="245" fill="#9ca3af" font-family="monospace" font-size="10">Synthesized in 240ms via Groq API (LLaMA-3)</text>

    <!-- Prompt Input Bar -->
    <rect x="20" y="280" width="476" height="42" rx="6" fill="#0b0f19" stroke="#374151"/>
    <text x="35" y="306" fill="#6b7280" font-family="sans-serif" font-size="12">Ask a question about Engineering knowledge base...</text>
  </g>
</svg>