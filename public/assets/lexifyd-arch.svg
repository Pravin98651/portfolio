<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#111827" rx="12"/>
  <text x="30" y="38" fill="white" font-family="sans-serif" font-weight="900" font-size="18">Lexifyd Tamil — Polysemic AI Generation Pipeline</text>
  
  <!-- Step 1: Input Ambiguous Root -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="210" height="130" rx="8" fill="#1f2937" stroke="#3b82f6" stroke-width="2"/>
    <text x="15" y="28" fill="#60a5fa" font-family="monospace" font-size="11" font-weight="bold">ROOT WORD INPUT</text>
    <text x="15" y="52" fill="white" font-family="sans-serif" font-size="13" font-weight="bold">Ambiguous Tamil Terms</text>
    <text x="15" y="76" fill="#9ca3af" font-family="sans-serif" font-size="11">• Words with multi-senses</text>
    <text x="15" y="94" fill="#9ca3af" font-family="sans-serif" font-size="11">• e.g. "படி" (study / step)</text>
    <text x="15" y="112" fill="#9ca3af" font-family="sans-serif" font-size="11">• User/curator submission</text>
  </g>

  <!-- Arrow -->
  <line x1="240" y1="145" x2="280" y2="145" stroke="#3b82f6" stroke-width="3" stroke-dasharray="4 4"/>
  <polygon points="280,145 272,140 272,150" fill="#3b82f6"/>

  <!-- Step 2: Gemini Generation -->
  <g transform="translate(280, 80)">
    <rect x="0" y="0" width="240" height="130" rx="8" fill="#1f2937" stroke="#10b981" stroke-width="2"/>
    <text x="15" y="28" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">GEMINI PROMPT CHAIN</text>
    <text x="15" y="52" fill="white" font-family="sans-serif" font-size="13" font-weight="bold">Structured Output Schema</text>
    <text x="15" y="76" fill="#9ca3af" font-family="sans-serif" font-size="11">• Multi-sense semantic extraction</text>
    <text x="15" y="94" fill="#9ca3af" font-family="sans-serif" font-size="11">• Natural contextual sentences</text>
    <text x="15" y="112" fill="#9ca3af" font-family="sans-serif" font-size="11">• Smart grammatical distractors</text>
  </g>

  <!-- Arrow -->
  <line x1="520" y1="145" x2="560" y2="145" stroke="#10b981" stroke-width="3" stroke-dasharray="4 4"/>
  <polygon points="560,145 552,140 552,150" fill="#10b981"/>

  <!-- Step 3: Caching Layer -->
  <g transform="translate(560, 80)">
    <rect x="0" y="0" width="210" height="130" rx="8" fill="#1f2937" stroke="#f59e0b" stroke-width="2"/>
    <text x="15" y="28" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold">STORAGE & CACHING</text>
    <text x="15" y="52" fill="white" font-family="sans-serif" font-size="13" font-weight="bold">Dual-Tier Persistence</text>
    <text x="15" y="76" fill="#9ca3af" font-family="sans-serif" font-size="11">• Redis sub-millisecond cache</text>
    <text x="15" y="94" fill="#9ca3af" font-family="sans-serif" font-size="11">• PostgreSQL relational storage</text>
    <text x="15" y="112" fill="#9ca3af" font-family="sans-serif" font-size="11">• SQLite local fallback</text>
  </g>

  <!-- Downward Arrow -->
  <line x1="400" y1="210" x2="400" y2="260" stroke="#ec4899" stroke-width="3" stroke-dasharray="4 4"/>
  <polygon points="400,260 395,252 405,252" fill="#ec4899"/>

  <!-- Step 4: Frontend Game & Graph -->
  <g transform="translate(180, 260)">
    <rect x="0" y="0" width="440" height="140" rx="8" fill="#1f2937" stroke="#ec4899" stroke-width="2"/>
    <text x="20" y="28" fill="#f472b6" font-family="monospace" font-size="11" font-weight="bold">VITE + TYPESCRIPT REACT INTERACTION</text>
    <text x="20" y="52" fill="white" font-family="sans-serif" font-size="13" font-weight="bold">Gamified Drag-and-Drop & Semantic Web</text>
    <text x="20" y="76" fill="#9ca3af" font-family="sans-serif" font-size="11">• Interactive card matching against candidate sentences</text>
    <text x="20" y="94" fill="#9ca3af" font-family="sans-serif" font-size="11">• Interactive root-to-sense knowledge graph</text>
    <text x="20" y="112" fill="#9ca3af" font-family="sans-serif" font-size="11">• Immediate learner feedback loop</text>
  </g>
</svg>
