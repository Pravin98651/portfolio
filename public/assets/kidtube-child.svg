<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#0f172a" rx="12"/>
  <rect x="0" y="0" width="800" height="50" fill="#1e293b"/>
  <circle cx="30" cy="25" r="10" fill="#ef4444"/>
  <text x="50" y="30" fill="white" font-family="sans-serif" font-weight="900" font-size="16">KidTube Kids Edition</text>
  <rect x="620" y="12" width="150" height="26" rx="13" fill="#facc15" fill-opacity="0.2"/>
  <text x="635" y="29" fill="#fde047" font-family="monospace" font-size="11" font-weight="bold">⏳ 38m Screen Time</text>

  <!-- Child Viewport -->
  <g transform="translate(40, 70)">
    <!-- Main Player Card -->
    <rect x="0" y="0" width="460" height="340" rx="10" fill="#1e293b" stroke="#334155"/>
    <rect x="15" y="15" width="430" height="220" rx="8" fill="#334155"/>
    <circle cx="230" cy="125" r="28" fill="#ef4444"/>
    <polygon points="224,113 224,137 244,125" fill="white"/>
    
    <text x="18" y="265" fill="white" font-family="sans-serif" font-size="16" font-weight="bold">Exploring the Ocean: Blue Whales & Deep Sea</text>
    <text x="18" y="285" fill="#94a3b8" font-family="sans-serif" font-size="12">Curated Channel: National Geographic Kids · Approved by Parent</text>
    <rect x="18" y="300" width="130" height="24" rx="4" fill="#10b981" fill-opacity="0.2"/>
    <text x="26" y="316" fill="#34d399" font-family="monospace" font-size="11">✓ Verified Safe</text>
  </g>

  <!-- Right: Educational Activity Checkpoint -->
  <g transform="translate(520, 70)">
    <rect x="0" y="0" width="240" height="340" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="240" height="40" rx="10" fill="#f59e0b"/>
    <text x="20" y="26" fill="black" font-family="sans-serif" font-weight="900" font-size="13">⭐ MATH ACTIVITY TIME!</text>
    
    <text x="18" y="70" fill="#cbd5e1" font-family="sans-serif" font-size="12">Next video unlocked after:</text>
    <rect x="18" y="90" width="204" height="60" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="35" y="128" fill="#fde047" font-family="sans-serif" font-weight="bold" font-size="22">8 × 7 = ?</text>

    <!-- Quiz options -->
    <rect x="18" y="165" width="96" height="36" rx="6" fill="#334155"/>
    <text x="56" y="188" fill="white" font-family="sans-serif" font-weight="bold" font-size="14">54</text>

    <rect x="126" y="165" width="96" height="36" rx="6" fill="#10b981"/>
    <text x="164" y="188" fill="white" font-family="sans-serif" font-weight="bold" font-size="14">56 ✓</text>

    <rect x="18" y="210" width="96" height="36" rx="6" fill="#334155"/>
    <text x="56" y="233" fill="white" font-family="sans-serif" font-weight="bold" font-size="14">62</text>

    <rect x="126" y="210" width="96" height="36" rx="6" fill="#334155"/>
    <text x="164" y="233" fill="white" font-family="sans-serif" font-weight="bold" font-size="14">48</text>

    <text x="18" y="280" fill="#94a3b8" font-family="sans-serif" font-size="11">Introduced every 3 videos to encourage active learning.</text>
