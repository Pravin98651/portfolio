<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#0f172a" rx="12"/>
  <!-- Header -->
  <rect x="0" y="0" width="800" height="60" fill="#1e293b"/>
  <rect x="24" y="16" width="32" height="30" rx="6" fill="#f59e0b"/>
  <text x="32" y="37" fill="white" font-family="system-ui, sans-serif" font-weight="bold" font-size="18">அ</text>
  <text x="68" y="37" fill="white" font-family="system-ui, sans-serif" font-weight="900" font-size="20">Lexifyd Tamil</text>
  <rect x="230" y="18" width="160" height="24" rx="12" fill="#f59e0b" fill-opacity="0.2"/>
  <text x="240" y="34" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold">● CONTEXTUAL POLYSEMY</text>

  <!-- Left: Ambiguous Word Breakdown -->
  <g transform="translate(24, 80)">
    <rect x="0" y="0" width="360" height="340" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="20" y="35" fill="#f59e0b" font-family="monospace" font-size="12" font-weight="bold">SELECTED ROOT WORD</text>
    
    <rect x="20" y="48" width="320" height="60" rx="6" fill="#0f172a" stroke="#f59e0b"/>
    <text x="35" y="85" fill="white" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">பார் (Paar)</text>
    <text x="180" y="83" fill="#94a3b8" font-family="sans-serif" font-size="12">Root with 2+ Meanings</text>

    <!-- Meaning 1 -->
    <rect x="20" y="125" width="320" height="85" rx="6" fill="#0f172a"/>
    <text x="32" y="148" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">Meaning 1: To Look / Watch / See</text>
    <text x="32" y="170" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">அவன் வானத்தைப் பார்த்தான்.</text>
    <text x="32" y="190" fill="#64748b" font-family="sans-serif" font-size="11">"He looked at the sky."</text>

    <!-- Meaning 2 -->
    <rect x="20" y="225" width="320" height="85" rx="6" fill="#0f172a"/>
    <text x="32" y="248" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold">Meaning 2: The Earth / World</text>
    <text x="32" y="270" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">பார் போற்றும் நல்ல தலைவன்.</text>
    <text x="32" y="290" fill="#64748b" font-family="sans-serif" font-size="11">"A great leader praised by the world."</text>
  </g>

  <!-- Right: Interactive Exercise & Semantic Graph -->
  <g transform="translate(410, 80)">
    <rect x="0" y="0" width="365" height="340" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="20" y="35" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">CONTEXTUAL EXERCISE GENERATOR</text>
    
    <rect x="20" y="50" width="325" height="90" rx="6" fill="#0f172a"/>
    <text x="35" y="78" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="bold">Which meaning applies to this sentence?</text>
    <text x="35" y="102" fill="#facc15" font-family="system-ui, sans-serif" font-size="14">"இந்தப் பாரில் அமைதி நிலவ வேண்டும்."</text>
    <text x="35" y="124" fill="#94a3b8" font-family="sans-serif" font-size="11">("Peace must prevail in this world.")</text>

    <!-- Interactive Options -->
    <rect x="20" y="155" width="325" height="36" rx="6" fill="#334155" stroke="#10b981" stroke-width="2"/>
    <text x="35" y="178" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold">A. உலகம் / The World  ✓ (Correct)</text>

    <rect x="20" y="200" width="325" height="36" rx="6" fill="#0f172a"/>
    <text x="35" y="223" fill="#94a3b8" font-family="sans-serif" font-size="12">B. பார்த்தல் / To Look  (Distractor)</text>

    <rect x="20" y="245" width="325" height="36" rx="6" fill="#0f172a"/>
    <text x="35" y="268" fill="#94a3b8" font-family="sans-serif" font-size="12">C. பாரம் / Weight  (Distractor)</text>

    <rect x="20" y="295" width="325" height="30" rx="4" fill="#f59e0b"/>
    <text x="110" y="315" fill="black" font-family="sans-serif" font-size="12" font-weight="bold">Gemini 1.5 Dynamic Generation</text>
  </g>
</svg>